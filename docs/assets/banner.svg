<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="skills-doctor — audit the hidden token cost of agent skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0d2033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1070" cy="-40" r="260" fill="#1f6feb" opacity="0.10"/>
  <circle cx="120" cy="330" r="220" fill="#3fb950" opacity="0.08"/>

  <text x="64" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="700" fill="#f0f6fc">skills-doctor</text>
  <text x="64" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" fill="#9fb0c9">Audit the hidden token cost of your agent's skills</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15">
    <rect x="64" y="196" width="112" height="34" rx="17" fill="#16233a" stroke="#2b3f5f"/>
    <text x="120" y="218" fill="#c9d6ea" text-anchor="middle">OpenCode</text>
    <rect x="186" y="196" width="122" height="34" rx="17" fill="#16233a" stroke="#2b3f5f"/>
    <text x="247" y="218" fill="#c9d6ea" text-anchor="middle">Claude Code</text>
    <rect x="318" y="196" width="86" height="34" rx="17" fill="#16233a" stroke="#2b3f5f"/>
    <text x="361" y="218" fill="#c9d6ea" text-anchor="middle">Codex</text>
    <rect x="414" y="196" width="78" height="34" rx="17" fill="#16233a" stroke="#2b3f5f"/>
    <text x="453" y="218" fill="#c9d6ea" text-anchor="middle">DSH</text>
    <rect x="502" y="196" width="86" height="34" rx="17" fill="#16233a" stroke="#2b3f5f"/>
    <text x="545" y="218" fill="#c9d6ea" text-anchor="middle">Grok</text>
  </g>

  <g transform="translate(760,44)">
    <rect width="392" height="212" rx="14" fill="#0a1120" stroke="#2b3f5f"/>
    <circle cx="22" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="58" cy="20" r="5" fill="#27c93f"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">
      <text x="22" y="62" fill="#8b9bb4">$ npx opencode-skills-doctor check</text>
      <text x="22" y="96" fill="#3fb950">✓ 29 skills · ~3,074 tokens/step</text>
      <text x="22" y="128" fill="#d29922">! over budget ×2</text>
      <text x="22" y="160" fill="#58a6ff">plan → save ~1,940 tokens/step</text>
      <text x="22" y="192" fill="#8b9bb4">told you in the chat →</text>
    </g>
  </g>

  <rect x="64" y="262" width="72" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
