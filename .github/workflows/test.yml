name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        if: runner.os != 'macOS'
        run: npm test
      - name: Test (annotate failures)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/skills-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '✖|not ok|AssertionError|Error:' "$RUNNER_TEMP/skills-test.log" | head -40 | while IFS= read -r line; do
              echo "::error title=failing test::$(echo "$line" | sed 's/"/\\"/g' | cut -c1-400)"
            done
          fi
          exit "$status"

  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clean fixture must pass
        id: clean
        uses: ./
        with:
          root: test/fixtures/action-clean
          budget: "1200"
          fail-on: error
      - name: Over-budget fixture must fail
        id: bloated
        continue-on-error: true
        uses: ./
        with:
          root: test/fixtures/action-over
          budget: "10"
          fail-on: error
      - name: Assert the action reported what it found
        env:
          CLEAN_EXIT: ${{ steps.clean.outputs.exit-code }}
          CLEAN_ERRORS: ${{ steps.clean.outputs.error-count }}
          BLOATED_OUTCOME: ${{ steps.bloated.outcome }}
          BLOATED_EXIT: ${{ steps.bloated.outputs.exit-code }}
          BLOATED_ERRORS: ${{ steps.bloated.outputs.error-count }}
        run: |
          set -eu
          test "$CLEAN_EXIT" = "0"
          test "$CLEAN_ERRORS" = "0"
          test "$BLOATED_OUTCOME" = "failure"
          test "$BLOATED_EXIT" = "1"
          test "$BLOATED_ERRORS" != "0"
          echo "action self-test passed"
